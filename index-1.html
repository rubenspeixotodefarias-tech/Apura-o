<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apuração de Votos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#000;--surface:#101828;--fg:#fff;--muted:#a9b4c6;--accent:#1f9d55;--track:rgba(255,255,255,.12);--line:rgba(255,255,255,.18);--warn:#f0b64a;--tc:#fff;--sc:var(--muted);--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Public Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding:28px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);margin:0;font-weight:600}
h1{font-size:2.1rem;line-height:1.1;color:var(--tc)}
h2{font-size:1.3rem;text-transform:uppercase;letter-spacing:.02em}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sub{margin:4px 0 0;color:var(--sc)}
.logo{max-height:72px;max-width:min(240px,60vw);object-fit:contain}
.notice{margin:10px 0 0;padding:6px 10px;max-width:62ch;font-size:.85rem;border-left:3px solid var(--accent);background:var(--track);border-radius:0 4px 4px 0;white-space:pre-wrap}
.notice.warn{border-left-color:var(--warn)}.notice.muted{border-left-color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vs-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.scol{display:flex;flex-direction:column;gap:8px;min-width:0}.scol.l{align-items:flex-start}.scol.r{align-items:flex-end}
.side{display:flex;align-items:center;gap:14px;min-width:0}.side.r{flex-direction:row-reverse;text-align:right}
.av{width:96px;height:96px;flex:none;border-radius:14px;background:var(--c);overflow:hidden;display:grid;place-items:center;font:700 2.2rem var(--display);color:#fff}
.av img{width:100%;height:100%;object-fit:cover}
.stxt{display:flex;flex-direction:column;gap:4px;min-width:0}
.sname{font:700 clamp(1.6rem,5.4vw,2.7rem)/1 var(--display);overflow-wrap:anywhere}
.stag{font:600 1.2rem/1 var(--display);color:var(--c)}
.badge{font:700 1.05rem var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 12px;border-radius:6px;color:#fff;min-height:26px}
.badge.win{background:#1f9d55}.badge.run{background:var(--warn);color:#000}.badge.no{background:#b3261e}
.bar{position:relative;height:68px;border-radius:14px;background:#1f2a26;margin-top:16px;overflow:hidden;display:flex}
.seg{height:100%;background:var(--c);display:flex;align-items:center;padding:0 16px;white-space:nowrap;transition:width .35s;overflow:hidden;min-width:0}
.seg.r{justify-content:flex-end;flex-direction:row-reverse}
.sp{font:700 2.1rem var(--display);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}.sv{font:500 1.2rem var(--display);color:#fff;opacity:.92;margin:0 10px}
.foot{display:flex;justify-content:flex-end;margin-top:12px;align-items:center;gap:10px}
.progbar{width:120px;height:6px;background:var(--track);border-radius:3px;overflow:hidden}.progbar i{display:block;height:100%;background:var(--accent)}
.prog b{font:600 1.35rem var(--display);color:var(--accent)}
.summary{display:grid;grid-template-columns:1.1fr 1.4fr;gap:20px 32px;align-items:end}
.total{font:600 clamp(3.2rem,11vw,5.2rem)/.95 var(--display);display:block}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metrics b{font:600 1.7rem var(--display);display:block}
.status{grid-column:1/-1;margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--track);border-radius:0 4px 4px 0;font-weight:500}
ul{list-style:none;margin:12px 0 0;padding:0}
.row{display:grid;grid-template-columns:30px 44px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row .av{width:44px;height:44px;border-radius:10px;border:3px solid var(--c);font-size:1.1rem}
.rank{font:1.15rem var(--display);color:var(--muted)}.nm{font-weight:600;min-width:0}.nm small{color:var(--muted);font-weight:400;margin-left:6px}
.pct{text-align:right}.pct b{font:700 1.6rem var(--display);display:block;line-height:1}.pct span{font-size:.75rem;color:var(--muted)}
.mini{grid-column:3/-1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}.mini i{display:block;height:100%;background:var(--c)}
.rowb{margin-left:8px;font-size:.8rem;padding:1px 8px;vertical-align:middle}
footer{color:var(--muted);font-size:.8rem}
@media(max-width:640px){.side,.side.r{flex-direction:column;align-items:flex-start;gap:8px}.side.r{align-items:flex-end}.stag{font-size:1rem}.sname{hyphens:auto}.nm small{display:block;margin:0}.summary{grid-template-columns:1fr}.av{width:64px;height:64px}.bar{height:56px}.sp{font-size:1.5rem}.sv{font-size:1rem}.sname{font-size:1.5rem}}
</style></head><body>
<div class="wrap">
<header><div><h1 id="t"></h1><p class="sub" id="s"></p><div class="notice" id="n" hidden></div></div><img id="lg" class="logo" alt="" hidden></header>
<section class="panel"><div class="vs-head" id="vs"></div><div class="bar" id="bar"></div><div class="foot" id="foot"></div></section>
<section class="panel summary"><div><span class="label">Total de votos apurados</span><span class="total" id="tot">0</span></div>
<div class="metrics"><div><span class="label">Válidos</span><b id="mv">0</b></div><div><span class="label">Brancos</span><b id="mb">0</b></div><div><span class="label">Nulos</span><b id="mn">0</b></div></div>
<p class="status" id="st"></p></section>
<section class="panel" id="restp" hidden><h2>Demais candidatos</h2><ul id="rest"></ul></section>
<p class="label" id="upd"></p>
<footer>Porcentagem dos candidatos calculada sobre os votos válidos. Esta página mostra o resultado da última atualização; recarregue para ver novos números.</footer>
</div>

var $=function(s){return document.querySelector(s)};
var fm=function(n){return n.toLocaleString('pt-BR',{maximumFractionDigits:2})};
var pc=function(n){return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ini(n){var p=String(n||'?').trim().split(/\s+/);return((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()}
function av(c){return '<div class="av">'+(c.img&&/^data:image\//.test(c.img)?'<img alt="" src="'+c.img+'">':esc(ini(c.name)))+'</div>'}
function render(D){
  var r=document.documentElement.style;
  r.setProperty('--bg',D.bg);r.setProperty('--surface',D.surface);r.setProperty('--accent',D.accent);
  if(D.titleColor)r.setProperty('--tc',D.titleColor);if(D.subColor)r.setProperty('--sc',D.subColor);
  document.title=D.title;$('#t').textContent=D.title;$('#s').textContent=D.sub||'';
  var n=$('#n');n.hidden=!D.notice;n.textContent=D.notice||'';n.className='notice'+(D.noticeTone==='warn'?' warn':D.noticeTone==='muted'?' muted':'');
  var lg=$('#lg');if(D.logo&&/^data:image\//.test(D.logo)){lg.src=D.logo;lg.hidden=false}else lg.hidden=true;
  var L=D.cands.map(function(c,i){return{c:c,i:i}}).sort(function(a,b){return b.c.votes-a.c.votes||a.i-b.i}).map(function(x){return x.c});
  var valid=L.reduce(function(s,c){return s+c.votes},0),total=valid+D.blank+D.nulls;
  var P=function(c){return valid?c.votes/valid*100:0};
  var res=D.result&&D.result.type?D.result:null,ne=D.nelect||[];
  function badge(c){
    if(res&&res.type==='elected'&&res.id===c.id)return '<span class="badge win">Eleito</span>';
    if(res&&res.type==='runoff'&&(res.ids||[]).indexOf(c.id)>=0)return '<span class="badge run">Segundo turno</span>';
    if(ne.indexOf(c.id)>=0)return '<span class="badge no">Não eleito</span>';return '<span class="badge"></span>'}
  function col(c,cls){if(!c)return '<div class="scol '+cls+'"></div>';
    return '<div class="scol '+cls+'" style="--c:'+esc(c.hex||'#4263eb')+'">'+badge(c)+'<div class="side '+cls+'">'+av(c)+'<div class="stxt"><strong class="sname">'+esc(c.name)+'</strong><span class="stag">'+esc(c.tag||'')+'</span></div></div></div>'}
  $('#vs').innerHTML=col(L[0],'l')+col(L[1],'r');
  var a=L[0],b=L[1],pa=a?P(a):0,pb=b?P(b):0,sh=pa+pb||1;
  function seg(c,p,cls){return c?'<div class="seg '+cls+'" style="--c:'+esc(c.hex||'#4263eb')+';width:'+(valid?p/sh*100:50)+'%"><span class="sp">'+pc(p)+'</span><span class="sv">'+fm(c.votes)+'</span></div>':''}
  $('#bar').innerHTML=seg(a,pa,'l')+seg(b,pb,'r');
  var pv=typeof D.progress==='number'?Math.max(0,Math.min(100,D.progress)):null;
  $('#foot').innerHTML=pv===null?'':'<span class="prog"><span class="progbar"><i style="display:block;width:'+pv+'%"></i></span></span><span class="prog"><b>'+pc(pv).replace('%','')+'% apurado</b></span>';
  $('#tot').textContent=fm(total);$('#mv').textContent=fm(valid);$('#mb').textContent=fm(D.blank);$('#mn').textContent=fm(D.nulls);
  var st='Aguardando os primeiros votos.';
  if(valid){st=L[0].name+' lidera com '+pc(P(L[0]))+' dos votos válidos.'}
  if(res&&res.type==='elected'){var e=L.filter(function(c){return c.id===res.id})[0];if(e)st=e.name+' foi declarado(a) eleito(a).'}
  else if(res&&res.type==='runoff'){var rn=(res.ids||[]).map(function(i){return(L.filter(function(c){return c.id===i})[0]||{}).name}).filter(Boolean);if(rn.length)st='Segundo turno entre '+rn.join(' e ')+'.'}
  $('#st').textContent=st;
  var rest=L.slice(2);$('#restp').hidden=!rest.length;
  $('#rest').innerHTML=rest.map(function(c,i){return '<li class="row" style="--c:'+esc(c.hex||'#4263eb')+'"><span class="rank">'+(i+3)+'º</span>'+av(c)+'<div class="nm">'+esc(c.name)+'<small>'+esc(c.tag||'')+'</small>'+(ne.indexOf(c.id)>=0?'<span class="badge no rowb">Não eleito</span>':'')+'</div><div class="pct"><b>'+pc(P(c))+'</b><span>'+fm(c.votes)+' votos</span></div><div class="mini"><i style="display:block;width:'+P(c)+'%"></i></div></li>'}).join('');
  $('#upd').textContent=D.ts?'Atualizado em '+new Date(D.ts).toLocaleString('pt-BR'):'';
}
render(DATA);
function poll(){fetch('data.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.cands)render(j)}).catch(function(){})}
poll();setInterval(poll,20000);
</script></body></html>
